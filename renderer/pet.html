<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; img-src 'self' file: data:; style-src 'self' 'unsafe-inline';">
  <title>XiaoA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      -webkit-app-region: drag;
      cursor: grab;
    }
    #pet {
      width: 80%;
      height: 80%;
      object-fit: contain;
      /* 性能：去掉 drop-shadow 滤镜，避免透明窗口动画时每帧昂贵的滤镜合成 */
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="pet" alt="桌宠" draggable="false">
  </div>
  <script src="pet.js"></script>
</body>
</html>
