<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline';">
  <title>XiaoA 权限请求</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .card {
      width: calc(100% - 20px);
      height: calc(100% - 20px);
      margin: 10px;
      border-radius: 16px;
      background: linear-gradient(150deg, rgba(24,26,34,.94), rgba(15,16,22,.96));
      border: 1px solid rgba(255,255,255,.12);
      color: #e5e7eb;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    .head { display: flex; align-items: center; gap: 8px; min-height: 18px; -webkit-app-region: drag; }
    .lock { flex: none; font-size: 12px; }
    .head-title { flex: 1; font-size: 13px; font-weight: 600; }
    .badge {
      flex: none;
      font-size: 10px; padding: 2px 8px; border-radius: 99px;
      background: rgba(251,191,36,.15); color: #fbbf24;
    }
    .close {
      flex: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: rgba(255,255,255,.08); color: #9ca3af;
      font-size: 10px; line-height: 16px; text-align: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .close:hover { background: rgba(248,113,113,.4); color: #fff; }
    .proj {
      font-size: 12px; font-weight: 600; color: #93c5fd;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .op {
      flex: 1; min-height: 0;
      font-size: 11.5px; line-height: 1.55; color: #d1d5db;
      background: rgba(255,255,255,.05);
      border-radius: 8px; padding: 7px 9px;
      max-height: 56px; overflow: auto;
      word-break: break-all;
    }
    .btns { display: flex; align-items: center; gap: 10px; }
    .btn {
      flex: 1;
      padding: 6px 0; border: none; border-radius: 10px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; outline: none;
      font-family: inherit;
    }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn.allow { background: rgba(52,211,153,.18); color: #34d399; }
    .btn.allow:hover:not(:disabled) { background: rgba(52,211,153,.3); }
    .btn.deny { background: rgba(248,113,113,.18); color: #f87171; }
    .btn.deny:hover:not(:disabled) { background: rgba(248,113,113,.3); }
    .hint {
      min-height: 0;
      font-size: 10.5px; line-height: 1.4; color: #fbbf24;
      display: none;
      overflow: hidden;
    }
    .hint.show { display: block; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="lock">🔒</span>
      <span class="head-title">权限请求</span>
      <span class="badge">待批准</span>
      <span class="close" id="closeBtn" title="隐藏">✕</span>
    </div>
    <div class="proj" id="proj"></div>
    <div class="op" id="op"></div>
    <div class="btns">
      <button class="btn allow" id="btnAllow">允许</button>
      <button class="btn deny" id="btnDeny">拒绝</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
