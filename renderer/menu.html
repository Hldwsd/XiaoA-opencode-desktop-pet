<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>XiaoA 菜单</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .menu {
      position: absolute;
      top: 0; left: 0;
      min-width: 168px;
      background: rgb(24, 26, 34);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 10px;
      padding: 5px;
      color: #e5e7eb;
      font-size: 12.5px;
      z-index: 2;
    }
    .menu.sub { z-index: 20; display: none; }
    .mi {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 8px;
      border-radius: 7px;
      white-space: nowrap;
      cursor: default;
      position: relative;
    }
    .mi .mark { width: 16px; flex: none; text-align: center; color: #34d399; }
    .mi .txt { flex: 1; }
    .mi .arr { flex: none; color: #6b7280; font-size: 10px; }
    .mi .del {
      flex: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: rgba(248,113,113,.15);
      color: #f87171;
      font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      visibility: hidden;
    }
    .mi:hover .del { visibility: visible; }
    .mi .del:hover { background: rgba(248,113,113,.4); }
    .mi:hover { background: rgba(59, 130, 246, .28); }
    .mi.disabled { color: #6b7280; }
    .mi.disabled:hover { background: transparent; }
    .sep { height: 1px; margin: 4px 6px; background: rgba(255, 255, 255, .1); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="menu.js"></script>
</body>
</html>
